<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver une salle</title>
    <link rel="stylesheet" href="/App.css">
</head>

<body>

    <h1>Réserver une salle</h1>

    <div class="form-container">

        <label for="date">Date :</label>
        <input type="date" id="date" required>

        <label for="start">Heure de début :</label>
        <select id="start" required>
            <option value="">-- Sélectionner --</option>
            <option>08:00</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
        </select>

        <label for="end">Heure de fin :</label>
        <select id="end">
            <option value="">-- Sélectionner --</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
        </select>

        <label for="room">Nom de la salle :</label>
        <select id="room" required>
            <option value="">-- Choisir une salle --</option>
            <option>Salle A</option>
            <option>Salle B</option>
            <option>Salle C</option>
        </select>

        <button id="reserve-btn">Réserver</button>

        <p id="confirmation" class="hidden">Votre réservation est enregistrée.</p>

    </div>

    <script src="js/scripts.js" defer></script>
</body>
</html>
